rc:
  # font
  "font.family": "Arial"
  "font.size": 6
  "axes.labelsize": 6
  "xtick.labelsize": 5.5
  "ytick.labelsize": 5.5
  "axes.titlesize": 6
  "legend.fontsize": 5.5
  "figure.titlesize": 6
  # axes
  "axes.facecolor": "ffffff00"
  "axes.spines.top": False
  "axes.spines.right": False
  "axes.linewidth": 0.25
  "xtick.major.width": 0.2
  "ytick.major.width": 0.2
  "xtick.minor.width": 0.15
  "ytick.minor.width": 0.15
  "xtick.major.pad": 1.5
  "ytick.major.pad": 1.5
  "xtick.major.size": 1.2
  "ytick.major.size": 1.2
  "xtick.minor.size": 1
  "ytick.minor.size": 1
  # legend
  "legend.frameon": False
  # misc
  "hatch.linewidth": 0.5

savefig:
  transparent: True
  dpi: 1200

behavior:
  keys:
    rear: "angle_reer"
    loco: "locomotion"
    raise: "head_raise"
    turn: "bend"
    hunch: "hunch"
